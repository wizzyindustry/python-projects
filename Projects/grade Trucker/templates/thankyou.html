{% extends "base.html" %}
{% block content %}

<div class="thankyou-box">
    <h2>Thank You, {{ name }}! 🎉</h2>
    <p>We have received your message and will get back to you at <strong>{{ email }}</strong> soon.</p>

    <div class="message-box">
        <h3>Your Message:</h3>
        <p>{{ message }}</p>
    </div>

    <a href="/" class="btn">⬅ Send Another Message</a>
</div>

{% endblock %}
