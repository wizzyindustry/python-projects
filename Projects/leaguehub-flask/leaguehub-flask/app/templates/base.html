<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}LeagueHub{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--navy:#0c2340;--navy-light:#1a4a6e;--teal:#2d8a9e;--teal-light:#5cbdb9;}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;}
.bg-navy{background:var(--navy)!important;}
.text-teal{color:var(--teal-light)!important;}
.btn-teal{background:var(--teal);color:#fff;border:none;}
.btn-teal:hover{background:var(--navy-light);color:#fff;}
.card{border:none;box-shadow:0 2px 12px rgba(0,0,0,.08);border-radius:.75rem;}
.score-input{width:60px;text-align:center;display:inline-block;}
.table-top{background:rgba(45,138,158,.08);}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-navy py-2">
<div class="container">
<a class="navbar-brand fw-bold" href="/">⚽ LeagueHub</a>
<div>
{% if current_user.is_authenticated %}
<a href="{{ url_for('main.dashboard') }}" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
<a href="{{ url_for('auth.logout') }}" class="btn btn-sm btn-outline-light">Logout</a>
{% else %}
<a href="{{ url_for('auth.login') }}" class="btn btn-sm btn-outline-light me-2">Login</a>
<a href="{{ url_for('auth.signup') }}" class="btn btn-sm btn-teal">Sign Up</a>
{% endif %}
</div>
</div>
</nav>
<main class="container py-4">
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for cat, msg in messages %}<div class="alert alert-{{cat}} alert-dismissible fade show"><button type="button" class="btn-close" data-bs-dismiss="alert"></button>{{msg}}</div>{% endfor %}{% endif %}{% endwith %}
{% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
