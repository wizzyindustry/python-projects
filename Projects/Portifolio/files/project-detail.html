<div class="toast-container" id="toastContainer"></div>

<!-- Blog modal (reused) -->
<div class="modal-overlay" id="blogModal" onclick="if(event.target===this)closeBlogModal()">
    <div class="modal-panel blog-modal-panel">
        <button class="modal-close" onclick="closeBlogModal()">&times;</button>
        <div id="blogModalContent"></div>
    </div>
</div>

<div class="search-overlay" id="searchOverlay" onclick="if(event.target===this)closeSearch()">
    <button class="search-close" onclick="closeSearch()">&times;</button>
    <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="Search projects & blog posts..." oninput="runSearch(this.value)" autofocus>
    </div>
    <div class="search-results" id="searchResults"></div>
</div>

<script src="firebase-config.js"></script>
<script src="data-loader.js"></script>
<script src="settings-loader.js"></script>
<script>if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js');}</script>
<script>
    if (!navigator.onLine) {
        document.getElementById('offlineOverlay').classList.add('show');
    }
    window.addEventListener('online', function() { document.getElementById('offlineOverlay').classList.remove('show'); location.reload(); });
    window.addEventListener('offline', function() {
        document.getElementById('offlineOverlay').classList.add('show');
    });

    // Theme
    var html = document.documentElement;
    var toggle = document.querySelector('.theme-toggle');
    function applyTheme(t) { if (t === 'light') html.setAttribute('data-theme', 'light'); else html.removeAttribute('data-theme'); }
    var saved = localStorage.getItem('theme');
    if (saved) applyTheme(saved);
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e) { if (!localStorage.getItem('theme')) applyTheme(e.matches ? 'light' : null); });
    if (toggle) {
        toggle.addEventListener('click', function() {
            var current = html.getAttribute('data-theme');
            var next = current === 'light' ? null : 'light';
            if (next) { html.setAttribute('data-theme', next); localStorage.setItem('theme', next); }
            else { html.removeAttribute('data-theme'); localStorage.removeItem('theme'); }
            document.querySelectorAll('.sun-icon, .moon-icon').forEach(function(el) { el.style.display = el.classList.contains(next ? 'moon-icon' : 'sun-icon') ? 'none' : ''; });
        });
    }
    document.querySelectorAll('.sun-icon, .moon-icon').forEach(function(el) {
        var isLight = html.getAttribute('data-theme') === 'light';
        el.style.display = el.classList.contains(isLight ? 'moon-icon' : 'sun-icon') ? 'none' : '';
    });

    // Scroll progress bar
    window.addEventListener('scroll', function() {
        var scrollTop = window.scrollY;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        var bar = document.getElementById('scrollProgress');
        if (bar) bar.style.width = progress + '%';
    });

    // Visitor count
    var visits = parseInt(localStorage.getItem('visitorCount') || '0') + 1;
    localStorage.setItem('visitorCount', visits);
    var vEl = document.getElementById('visits');
    if (vEl) vEl.textContent = visits;

    // Toast
    function showToast(msg, type) {
        var c = document.getElementById('toastContainer');
        if (!c) return;
        var el = document.createElement('div');
        el.className = 'toast ' + type;
        el.textContent = msg;
        c.appendChild(el);
        setTimeout(function() { el.classList.add('show'); }, 10);
        setTimeout(function() { el.classList.remove('show'); setTimeout(function() { el.remove(); }, 300); }, 3000);
    }

    // Load project from URL
    (function() {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id');
        if (!id) {
            document.getElementById('projectDetailContent').innerHTML = '<div style="text-align:center;padding:60px 0"><h1 style="color:var(--accent);margin-bottom:12px">Project Not Found</h1><p style="color:var(--muted)">No project ID specified. <a href="projects.html" style="color:var(--gold)">Back to projects</a></p></div>';
            return;
        }
        try {
            var raw = localStorage.getItem('wizzyAdminData');
            if (!raw) throw new Error('No data');
            var admin = JSON.parse(raw);
            var projects = admin.projects || [];
            var project = null;
            for (var i = 0; i < projects.length; i++) {
                if (projects[i].id == id) { project = projects[i]; break; }
            }
            if (!project) {
                document.getElementById('projectDetailContent').innerHTML = '<div style="text-align:center;padding:60px 0"><h1 style="color:var(--accent);margin-bottom:12px">Project Not Found</h1><p style="color:var(--muted)">The project may have been deleted. <a href="projects.html" style="color:var(--gold)">Back to projects</a></p></div>';
                return;
            }
            function esc(s) { if (typeof s !== 'string') return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
            var imgHtml = project.image ? '<img src="' + esc(project.image) + '" alt="' + esc(project.title) + '" style="width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin-bottom:24px">' : '';
            var techs = (project.techs || []).map(function(t) { return '<span style="display:inline-block;padding:4px 12px;border-radius:20px;border:1px solid #333;font-size:0.8rem;color:var(--muted);margin:3px">' + esc(t) + '</span>'; }).join('');
            var desc = project.description || '';
            // Update page title
            document.title = esc(project.title) + ' — Wizzy inc';
            // Update OG tags via settings-loader will handle meta
            document.getElementById('projectDetailContent').innerHTML = '<a href="projects.html" style="color:var(--gold);text-decoration:none;font-size:0.9rem;margin-bottom:16px;display:inline-block">&larr; Back to Projects</a>' +
                imgHtml +
                '<h1 style="font-size:2rem;color:var(--accent);margin-bottom:8px">' + esc(project.title) + '</h1>' +
                '<span style="display:inline-block;padding:4px 14px;border-radius:20px;background:var(--gold);color:#000;font-size:0.75rem;font-weight:600;margin-bottom:16px">' + esc(project.category) + '</span>' +
                '<p style="line-height:1.8;font-size:1rem;margin-bottom:20px">' + desc.replace(/\n/g, '<br>') + '</p>' +
                '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px">' + techs + '</div>' +
                '<div class="share-btns" id="projectShare" style="margin-top:0"></div>';
            // Add share buttons
            var shareDiv = document.getElementById('projectShare');
            if (shareDiv) {
                var shareUrl = encodeURIComponent(window.location.href);
                var shareTitle = encodeURIComponent(project.title);
                shareDiv.innerHTML = '<span>Share: </span>' +
                    '<a href="https://www.facebook.com/sharer/sharer.php?u=' + shareUrl + '" target="_blank" rel="noopener">FB</a>' +
                    '<a href="https://twitter.com/intent/tweet?text=' + shareTitle + '&url=' + shareUrl + '" target="_blank" rel="noopener">&#120143;</a>' +
                    '<a href="https://www.linkedin.com/shareArticle?mini=true&url=' + shareUrl + '&title=' + shareTitle + '" target="_blank" rel="noopener">in</a>' +
                    '<a href="https://api.whatsapp.com/send?text=' + shareTitle + '%20' + shareUrl + '" target="_blank" rel="noopener">WA</a>';
            }
        } catch(e) {
            document.getElementById('projectDetailContent').innerHTML = '<div style="text-align:center;padding:60px 0"><p style="color:var(--muted)">Could not load project data.</p></div>';
        }
    })();
</script>

</body>
